.btn{padding:10px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--text)}.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0}.btn.danger{color:#b91c1c}.btn.small{padding:7px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.stat .num{font-size:28px;font-weight:800;margin-top:5px}.muted{color:var(--muted);font-size:13px}
.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.clickable{transition:.15s}.clickable:hover{transform:translateY(-2px);box-shadow:0 14px 35px rgba(15,23,42,.12)}
.icon{font-size:30px}.category-photo{width:72px;height:72px;border-radius:14px;object-fit:cover;display:block;border:1px solid var(--line);box-shadow:0 4px 12px rgba(15,23,42,.10)}.category-photo.large{width:90px;height:90px;border-radius:16px}.card h3{margin:9px 0 5px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#4338ca;font-size:12px;margin:3px}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2))}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{background:#f8fafc}.status{font-size:12px;padding:4px 8px;border-radius:999px}.Completed{background:#dcfce7;color:#166534}.In\ Progress{background:#dbeafe;color:#1d4ed8}.Pending{background:#fef3c7;color:#92400e}.Started{background:#ede9fe;color:#6d28d9}
.empty{padding:35px;text-align:center;color:var(--muted)}
.search{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:230px}
.global-search-box{display:flex;gap:8px;align-items:center;margin-bottom:14px}.global-search-box input{flex:1}.result-list{display:grid;gap:9px}.result-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.result-item:hover{border-color:#c7d2fe;background:#fafaff}.result-item .meta{font-size:12px;color:var(--muted);margin-top:4px}.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.quick-grid button{min-height:58px;text-align:left}.recent-list{display:grid;gap:8px}.recent-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}

.auth-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f172a,#312e81)}
.auth-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.35)}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.auth-brand img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid #e5e7eb}
.auth-brand h2{margin:0;font-size:24px}.auth-brand p{margin:4px 0 0;color:#6b7280;font-size:13px}
.auth-title{margin:0 0 6px;font-size:21px}.auth-sub{margin:0 0 18px;color:#6b7280;font-size:13px;line-height:1.5}
.auth-field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.auth-field label{font-size:13px;font-weight:700}.auth-field input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;outline:none}.auth-field input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.auth-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.auth-actions button{padding:11px 14px;border-radius:10px;border:1px solid #e5e7eb;background:#fff}.auth-actions .primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:0}
.auth-link{background:none!important;border:0!important;color:#4f46e5!important;padding:7px 0!important;font-size:13px}
.auth-error{min-height:18px;color:#dc2626;font-size:13px;margin-top:8px}.auth-note{margin-top:18px;padding:10px 12px;background:#f3f4f6;border-radius:10px;color:#6b7280;font-size:11px;line-height:1.5}
body.auth-locked .app{display:none!important}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:12px;z-index:20}.modal{background:#fff;border-radius:16px;width:min(920px,100%);height:auto;max-height:96vh;overflow:hidden;padding:0;box-shadow:0 20px 60px rgba(15,23,42,.28)}.modal #modalBody{max-height:96vh;overflow-y:auto;overflow-x:hidden;padding:20px 22px 16px}.modal h2{margin:0 0 16px;position:sticky;top:-20px;background:#fff;z-index:2;padding:20px 0 12px;border-bottom:1px solid var(--line)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;position:sticky;bottom:-16px;background:#fff;padding:14px 0 2px;border-top:1px solid var(--line);z-index:3}.editor{border:1px solid var(--line);border-radius:10px;min-height:320px;padding:16px;outline:none;line-height:1.6;background:#fff;white-space:pre-wrap}.editor:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}.editor-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.editor-toolbar button{padding:7px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:700}.editor-toolbar button:hover{background:#f3f4f6}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1e40af;font-size:13px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head{font-size:12px;color:var(--muted);text-align:center;padding:7px}.day{min-height:82px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:12px}.day b{font-size:13px}.day.has{outline:2px solid #c7d2fe}.day .dot{margin-top:7px;color:#4f46e5;font-weight:700}
.kpi{font-size:23px;font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.learning-tree{display:flex;flex-direction:column;gap:2px;font-size:14px}
.tree-node{min-width:0}
.tree-children{margin-left:18px;padding-left:12px;border-left:1px solid var(--line)}
.tree-row{display:flex;align-items:center;gap:6px;min-height:42px;padding:5px 7px;border-radius:9px}
.tree-row:hover{background:#f8fafc}
.tree-toggle{width:25px;height:25px;flex:0 0 25px;border:1px solid var(--line);background:#fff;border-radius:6px;font-weight:800;line-height:1;color:var(--primary)}
.tree-spacer{display:block;width:25px;flex:0 0 25px}
.tree-label{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.tree-click{cursor:pointer}
.tree-icon{width:25px;flex:0 0 25px;text-align:center}

/* ===== Usability consistency patch =====
   Keeps the existing markup and behavior, while reducing visual variants. */

/* 1. Shared type scale: 10 rendered sizes or fewer. */
.top h1{font-size:28px}
.icon{font-size:28px}
.kpi{font-size:22px}
.auth-title{font-size:20px}
.tree-meta,.tree-percent,.btn.tiny,.tree-actions-inline .btn.tiny:first-child{font-size:10px}

/* 2. Shared radius tokens: 10px controls, 14px surfaces, 999px pills, 50% avatar. */
:root{--radius-control:10px;--radius-surface:14px}
.nav button,.btn,.search,.notice,.auth-note,.day,.recent-item,.result-item,
.table-wrap,.tree-panel,.tree-toggle,.btn.tiny{border-radius:var(--radius-control)}
.card,.top,.category-photo,.category-photo.large,.auth-card{border-radius:var(--radius-surface)}
.progress{border-radius:999px}

/* 3. Four practical button variants: default, primary, danger, compact. */
.btn{min-height:42px;padding:9px 14px;border-radius:var(--radius-control)}
.btn.small{min-height:34px;padding:6px 10px;font-size:13px}
.btn.tiny{min-height:30px;padding:5px 8px;font-size:10px}
.btn.primary{min-height:42px}
.btn.danger{color:#b91c1c}
.btn.small.primary{min-height:34px}
.btn.tiny.primary{min-height:30px}

/* 4–5. One 72px icon frame for every Main Category card.
   Images and fallback emoji occupy the same visual footprint. */
.category-cards .card .icon{
  width:72px;height:72px;display:flex;align-items:center;justify-content:center;
  font-size:28px;line-height:1;border-radius:var(--radius-surface);

}

  width:72px;height:72px;border-radius:var(--radius-surface);margin:0;
}
.category-cards .card h3{margin:10px 0 5px}

/* 6. Preserve the four-column rhythm when exactly five category cards exist. */
.category-cards{
  grid-template-columns:repeat(4,minmax(0,1fr));
}
.category-cards:has(> .card:nth-child(5):last-child) > .card:last-child{
  grid-column:2 / 4;
}

/* 7. Quick Capture is secondary, so keep it visually lighter than primary actions. */
.quick-grid button{
  min-height:44px;
  padding:8px 12px;
  font-size:13px;
}

/* 8. Header controls share one 42px baseline. */
.top .actions{align-items:center}
.top .search,
.top .actions > .btn.primary{
  height:42px;
  min-height:42px;
  box-sizing:border-box;
}

  .category-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .category-cards:has(> .card:nth-child(5):last-child) > .card:last-child{grid-column:auto}

<script>
function notesSanitize(html){
  const box=document.createElement('div');box.innerHTML=String(html||'');
  box.querySelectorAll('script,iframe,object,embed,form,meta,link,style,base').forEach(x=>x.remove());
  box.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value))el.removeAttribute(a.name)});});
  return box.innerHTML.trim();
}
function notesRichText(html){const box=document.createElement('div');box.innerHTML=notesSanitize(html);return (box.textContent||'').trim()}
function notesApply(cmd,val=null){const ed=document.querySelector('.notes-editor');if(!ed)return;ed.focus();document.execCommand(cmd,false,val)}
function notesFormatBlock(v){if(v)notesApply('formatBlock',v)}
function notesPasteHandler(e){
  const ed=e.currentTarget, cd=e.clipboardData;if(!cd)return;
  const html=cd.getData('text/html'), text=cd.getData('text/plain');
  if(html){
    const hasTable=/<table[\s>]/i.test(html), hasStyle=/<(td|th|col)[^>]*(style|width)=/i.test(html);
    if(hasTable||hasStyle){e.preventDefault();document.execCommand('insertHTML',false,notesSanitize(html));return;}
  }
  if(text && text.includes('\t')){
    e.preventDefault();const rows=text.replace(/\r/g,'').split('\n').filter(r=>r.length);const data=rows.map(r=>r.split('\t'));
    let h='<table><tbody>'+data.map((row,i)=>'<tr>'+row.map(c=>(i===0?'<th>':'<td>')+esc(c)+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</tbody></table><p><br></p>';
    document.execCommand('insertHTML',false,h);return;
  }
}
function inlineEditNotes(id){
  const r=db.records.find(x=>x.id===id);if(!r)return;
  const display=document.getElementById('inlineNotesDisplay-'+id);if(!display)return;
  const current=notesSanitize(r.notes||'');
  display.innerHTML=`<div class="notes-workspace"><div class="notes-editor-shell">
    <div class="notes-toolbar" role="toolbar" aria-label="Notes formatting tools">
      <button type="button" onclick="notesApply('bold')" title="Bold"><b>B</b></button><button type="button" onclick="notesApply('italic')" title="Italic"><i>I</i></button><button type="button" onclick="notesApply('underline')" title="Underline"><u>U</u></button>
      <span class="sep"></span><select onchange="notesFormatBlock(this.value);this.value=''" title="Text style"><option value="">Style</option><option value="p">Normal</option><option value="h2">Heading</option><option value="h3">Subheading</option></select>
      <button type="button" onclick="notesApply('insertUnorderedList')" title="Bullet list">• List</button><button type="button" onclick="notesApply('insertOrderedList')" title="Numbered list">1. List</button>
      <span class="sep"></span><button type="button" onclick="notesApply('justifyLeft')" title="Align left">≡</button><button type="button" onclick="notesApply('justifyCenter')" title="Center">≡</button><button type="button" onclick="notesApply('justifyRight')" title="Align right">≡</button>
      <span class="sep"></span><button type="button" class="primary-tool" onclick="notesCopy('${id}')" title="Copy formatted notes">📋 Copy</button><button type="button" class="primary-tool" onclick="notesPrint('${id}')" title="Print notes">🖨️ Print</button>
    </div>
    <div id="notesEditor-${id}" class="notes-editor" contenteditable="true" spellcheck="true">${current}</div>
    <div class="notes-footer"><span class="notes-hint">📊 Excel: Ctrl+C → here → Ctrl+V &nbsp; • &nbsp; Word formatting is preserved where available</span><div class="notes-actions"><button type="button" class="btn small" onclick="cancelInlineNotes('${id}')">Cancel</button><button type="button" class="btn small primary" onclick="saveInlineNotes('${id}')">💾 Save Notes</button></div></div>
  </div></div>`;
  const ed=document.getElementById('notesEditor-'+id);if(ed){ed.addEventListener('paste',notesPasteHandler);ed.focus();const rg=document.createRange();rg.selectNodeContents(ed);rg.collapse(false);const sel=getSelection();sel.removeAllRanges();sel.addRange(rg)}
}
function notesDisplay(id){const r=db.records.find(x=>x.id===id);return r&&r.notes?`<div class="notes-preview">${notesSanitize(r.notes)}</div>`:'<div class="empty">No notes added. Click <b>Edit</b> to start.</div>'}
function saveInlineNotes(id){const r=db.records.find(x=>x.id===id),ed=document.getElementById('notesEditor-'+id),display=document.getElementById('inlineNotesDisplay-'+id);if(!r||!ed||!display)return;r.notes=notesSanitize(ed.innerHTML);r.updatedAt=new Date().toISOString();save();display.innerHTML=notesDisplay(id);}
function cancelInlineNotes(id){const display=document.getElementById('inlineNotesDisplay-'+id);if(display)display.innerHTML=notesDisplay(id)}
function notesCopy(id){const r=db.records.find(x=>x.id===id),html=notesSanitize(document.getElementById('notesEditor-'+id)?.innerHTML||r?.notes||'');if(!html)return;const plain=notesRichText(html);if(navigator.clipboard&&window.ClipboardItem){navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]).catch(()=>{});}else{const ta=document.createElement('textarea');ta.value=plain;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}}
function notesPrint(id){const r=db.records.find(x=>x.id===id),html=notesSanitize(document.getElementById('notesEditor-'+id)?.innerHTML||r?.notes||'');const w=window.open('','_blank','width=900,height=700');if(!w)return;w.document.write('<!doctype html><html><head><title>'+esc(r?.title||'Notes')+'</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#172033}table{border-collapse:collapse;width:auto;max-width:100%}td,th{border:1px solid #777;padding:6px 9px;vertical-align:top}th{background:#eee}img{max-width:100%}</style></head><body><h2>'+esc(r?.title||'Notes')+'</h2>'+html+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),250)}

const IDB_STORE='app';

let _idbReady=false;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)) return reject(new Error('IndexedDB unavailable'));
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(IDB_STORE))req.result.createObjectStore(IDB_STORE)};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbGet(){
  try{
    const dbi=await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx=dbi.transaction(IDB_STORE,'readonly'), req=tx.objectStore(IDB_STORE).get(KEY);
      req.onsuccess=()=>resolve(req.result||null); req.onerror=()=>reject(req.error);
    });
  }catch(e){return null}
}
async function idbPut(data){
  try{
    const dbi=await idbOpen();
    await new Promise((resolve,reject)=>{
      const tx=dbi.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(data,KEY);
      tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
    });
    _idbReady=true;
  }catch(e){}
}
async function restoreMovedFileData(){
  const saved=await idbGet();
  if(saved && saved.categories && saved.records){
    const local=localStorage.getItem(KEY);
    if(!local){
      db=saved;
      localStorage.setItem(KEY,JSON.stringify(db));
    }
  }

const PROFILE_KEY='my_learning_work_hub_profile_photo_v1';

function getProfilePhoto(){
  try{const p=localStorage.getItem(PROFILE_KEY);return p&&p.startsWith('data:image/')?p:DEFAULT_PROFILE_PHOTO}catch(e){return DEFAULT_PROFILE_PHOTO}
}
function renderProfilePhoto(){
  const el=document.getElementById('profilePhoto');
  if(el) el.src=getProfilePhoto();
}
function setProfilePhoto(inp){
  const file=inp&&inp.files&&inp.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){alert('Please select an image file.');return}
  const reader=new FileReader();
  reader.onload=()=>{
    try{localStorage.setItem(PROFILE_KEY,reader.result)}catch(e){
      alert('Photo could not be saved in browser storage.');
      return;
    }
    renderProfilePhoto();
    inp.value='';
  };
  reader.readAsDataURL(file);
}

function localDbSnapshot(){
  try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&x.categories&&x.records?x:null}catch(e){return null}
}
async function cloudLoadOrMigrate(){
  if(!sb||!cloudUser)return false;
  const {data:row,error}=await sb.from('app_data').select('data,updated_at').eq('user_id',cloudUser.id).maybeSingle();
  if(error){console.error(error);authMsg('Cloud database read failed: '+error.message);return false;}
  if(row?.data){
    db=row.data;
    localStorage.setItem(KEY,JSON.stringify(db));
    return true;
  }
  const local=localDbSnapshot();
  db=local||seed();
  const {error:upErr}=await sb.from('app_data').upsert({user_id:cloudUser.id,data:db,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(upErr){console.error(upErr);authMsg('Cloud database setup failed: '+upErr.message);return false;}
  localStorage.setItem(KEY,JSON.stringify(db));
  return true;
}
function cloudSave(){
  if(!sb||!cloudUser)return Promise.resolve();
  const snapshot=JSON.parse(JSON.stringify(db));
  cloudSaveChain=cloudSaveChain.then(async()=>{
    cloudSaving=true;
    const payload={user_id:cloudUser.id,data:snapshot,updated_at:new Date().toISOString()};
    const {error}=await sb.from('app_data').upsert(payload,{onConflict:'user_id'});
    cloudSaving=false;
    if(error){console.error(error);alert('Cloud save failed: '+error.message);}
  });
  return cloudSaveChain;
}
async function createAuth(){
  if(!sb)return showCloudConfigRequired();
  const email=(document.getElementById('authEmail')?.value||'').trim();
  const p=document.getElementById('authPass')?.value||'',p2=document.getElementById('authPass2')?.value||'';
  if(!email)return authMsg('Email is required.');
  if(p.length<6)return authMsg('Password must be at least 6 characters.');
  if(p!==p2)return authMsg('Passwords do not match.');
  authMsg('Creating account...');
  const {data,error}=await sb.auth.signUp({email,password:p});
  if(error)return authMsg(error.message);
  if(data.session){cloudUser=data.user;await cloudLoadOrMigrate();unlockHub();}
  else authMsg('Account created. Check your email to confirm the account, then login.');
}
async function loginAuth(){
  if(!sb)return showCloudConfigRequired();
  const email=(document.getElementById('authEmail')?.value||'').trim();
  const p=document.getElementById('authPass')?.value||'';
  if(!email||!p)return authMsg('Email and password are required.');
  authMsg('Signing in...');
  const {data,error}=await sb.auth.signInWithPassword({email,password:p});
  if(error)return authMsg(error.message);
  cloudUser=data.user;
  const ok=await cloudLoadOrMigrate();
  if(ok)unlockHub();
}
async function unlockHub(){
  document.body.classList.remove('auth-locked');
  const a=document.getElementById('authScreen');if(a)a.style.display='none';
  sessionStorage.setItem(AUTH_SESSION,'1');
  try{renderProfilePhoto()}catch(e){}
  render();
}
async function lockHub(){
  try{if(sb)await sb.auth.signOut()}catch(e){}
  cloudUser=null;cloudReady=false;
  sessionStorage.removeItem(AUTH_SESSION);
  document.body.classList.add('auth-locked');
  const a=document.getElementById('authScreen');if(a){a.style.display='flex';showLogin();}
}
function loadSupabaseOptional(){
  return new Promise(resolve=>{
    if(!SUPABASE_CONFIGURED || window.supabase){
      if(window.supabase && !sb) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      resolve(!!sb); return;
    }
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    sc.async=true;
    sc.onload=()=>{
      try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);resolve(true)}
      catch(e){console.warn('Supabase optional init failed:',e);resolve(false)}
    };
    sc.onerror=()=>{console.warn('Supabase CDN unavailable; continuing offline.');resolve(false)};
    document.head.appendChild(sc);
  });
}

async function initAuth(){
  /* Local-first startup: the workspace must never be blocked by cloud/auth. */
  document.body.classList.remove('auth-locked');
  const a=document.getElementById('authScreen');
  if(a)a.style.display='none';

  /* Normalize/migrate local data before first render. */
  try{
    db=load();
    db.categories=Array.isArray(db.categories)?db.categories:[];
    db.types=Array.isArray(db.types)?db.types:[];
    db.courses=Array.isArray(db.courses)?db.courses:[];
    db.topics=Array.isArray(db.topics)?db.topics:[];
    db.records=Array.isArray(db.records)?db.records:[];
    if(!db.categories.length && !db.types.length && !db.courses.length){
      db=seed();
      localStorage.setItem(KEY,JSON.stringify(db));
    }
  }catch(e){
    console.error('Local startup recovery failed:',e);
    db=seed();
  }

  try{renderProfilePhoto()}catch(e){}
  render();

  /* Cloud sync is optional and starts only after the local UI is visible. */
  setTimeout(async()=>{
    try{
      const loaded=await loadSupabaseOptional();
      if(!loaded || !sb)return;
      const result=await Promise.race([
        sb.auth.getSession(),
        new Promise(resolve=>setTimeout(()=>resolve({data:{session:null}}),2500))
      ]);
      const session=result?.data?.session;
      if(!session?.user)return;
      cloudUser=session.user;
      try{
        const ok=await cloudLoadOrMigrate();
        if(ok){cloudReady=true;render();}
      }catch(e){console.warn('Optional cloud sync skipped:',e);}
    }catch(e){console.warn('Optional cloud auth skipped:',e);}
  },0);
}

function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function seed(){
 let d={categories:[],types:[],courses:[],topics:[],records:[]};
 const cat=(name,icon)=>{let x={id:uid('cat'),name,icon,photo:''};d.categories.push(x);return x};
 const typ=(categoryId,name)=>{let x={id:uid('type'),categoryId,name};d.types.push(x);return x};
 const course=(typeId,name)=>{let x={id:uid('course'),typeId,name};d.courses.push(x);return x};
 const topic=(courseId,name)=>{let x={id:uid('topic'),courseId,name};d.topics.push(x);return x};
 const computer=cat('Computer','💻');
 const computerType=typ(computer.id,'Computer');
 ['Computer Management','App Design','AI Learning','MS Excel','MS Word','Graphic Design'].forEach(n=>course(computerType.id,n));
 const ethical=typ(computer.id,'Ethical Hacking');
 const vmware=course(ethical.id,'VMware');
 topic(vmware.id,'Install Kali');
 const forex=cat('Forex','💱'), tech=typ(forex.id,'Technical'), fund=typ(forex.id,'Fundamental');
 [['SMC',['Market Structure','BOS / CHOCH','Liquidity','Order Block','Fair Value Gap','Entry Model']],
 ['ICT',['Market Structure','Liquidity','FVG','Order Block','Kill Zones','Entry Model']],
 ['Fibonacci',['Fibonacci Retracement','Fibonacci Extension','Golden Zone','Entry Setup']],
 ['Elliott Wave',['Wave 1','Wave 2','Wave 3','Wave 4','Wave 5','Corrective Waves']]].forEach(([n,ts])=>{let c=course(tech.id,n);ts.forEach(x=>topic(c.id,x))});
 ['FX News Reading Course','COT Report Analysis','Fundamental View','Economic Indicators'].forEach(n=>{let c=course(fund.id,n);['Basics','Daily Practice','Analysis Notes','Review'].forEach(x=>topic(c.id,x))});
 const office=cat('Office Work','🏢'), home=cat('Home Work','🏠'), general=cat('General Learning','📚');
 [['Office Management','Daily Office Tasks'],['Excel Work','Reports & Data']].forEach(([n,t])=>{let ty=typ(office.id,n);course(ty.id,t)});
 let ty=typ(home.id,'Household'); course(ty.id,'Daily Home Tasks');
 return d;
}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.categories?x:seed()}catch(e){return seed()}}
function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
  idbPut(db);

let currentCategory=null;
let treeExpanded=new Set();

function treeKey(kind,id){return `${kind}:${id}`}

function toggleTreeNode(kind,id){
 const k=treeKey(kind,id);
 if(treeExpanded.has(k)) treeExpanded.delete(k); else treeExpanded.add(k);
 render();
}

function expandAllTree(){
 db.categories.forEach(cat=>{
   treeExpanded.add(treeKey('cat',cat.id));
   db.types.filter(t=>t.categoryId===cat.id).forEach(t=>{
     treeExpanded.add(treeKey('type',t.id));
     db.courses.filter(q=>q.typeId===t.id).forEach(q=>treeExpanded.add(treeKey('course',q.id)));
   });
 });
 render();
}

function collapseAllTree(){
 treeExpanded.clear();
 render();
}

function treeNodeButton(kind,id,hasChildren){
 if(!hasChildren)return `<span class="tree-spacer"></span>`;
 let open=treeExpanded.has(treeKey(kind,id));
 return `<button class="tree-toggle" aria-label="${open?'Collapse':'Expand'}" onclick="event.stopPropagation();toggleTreeNode('${kind}','${id}')">${open?'−':'＋'}</button>`;
}

function treeStatsCategory(cat){
 let types=db.types.filter(t=>t.categoryId===cat.id);
 let courses=db.courses.filter(q=>types.some(t=>t.id===q.typeId));
 let records=db.records.filter(r=>r.categoryId===cat.id);
 let completed=records.filter(r=>r.status==='Completed').length;
 let progress=records.length?Math.round(completed/records.length*100):0;
 return {types,courses,records,progress};
}

function filterRecords(){
 let wrap=document.getElementById('recordTable');if(!wrap)return;
 let q=(document.getElementById('recordSearch')?.value||'').toLowerCase();
 let tid=document.getElementById('recordFilter')?.value||'';
 let cid=document.getElementById('recordCategoryFilter')?.value||'';
 let status=document.getElementById('recordStatusFilter')?.value||'';
 let sort=document.getElementById('recordSort')?.value||'date-desc';

 let rs=db.records.filter(r=>{
   let text=[r.title,r.notes,r.webLink,r.date,getCat(r.categoryId)?.name,getType(r.typeId)?.name,getCourse(r.courseId)?.name,getTopic(r.topicId)?.name,r.status].join(' ').toLowerCase();
   return (!q||text.includes(q))&&(!tid||r.topicId===tid)&&(!cid||r.categoryId===cid)&&(!status||r.status===status);
 });

 rs.sort((a,b)=>{
   if(sort==='date-asc') return (a.date||'').localeCompare(b.date||'');
   if(sort==='date-desc') return (b.date||'').localeCompare(a.date||'');
   if(sort==='hours-asc') return (+a.hours||0)-(+b.hours||0);
   if(sort==='hours-desc') return (+b.hours||0)-(+a.hours||0);
   if(sort==='title-asc') return (a.title||'').localeCompare(b.title||'');
   if(sort==='title-desc') return (b.title||'').localeCompare(a.title||'');
   if(sort==='status') return (a.status||'').localeCompare(b.status||'');
   return 0;
 });

 wrap.innerHTML=rs.length?`<div class="muted" style="margin:0 0 8px">${rs.length} record${rs.length===1?'':'s'} found</div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Category / Course</th><th>Topic</th><th>Work / Learning</th><th>Web Link</th><th>Hours</th><th>Status</th><th>Action</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(getCat(r.categoryId)?.name||'')}<br><span class="muted">${esc(getCourse(r.courseId)?.name||'')}</span></td><td>${esc(getTopic(r.topicId)?.name||'')}</td><td><b>${esc(r.title||'')}</b>${plainText(r.notes)?`<br><span class="muted">${esc(plainText(r.notes).slice(0,70))}${plainText(r.notes).length>70?'…':''}</span>`:''}</td><td>${r.webLink?`<a href="${esc(r.webLink)}" target="_blank" rel="noopener" class="btn small">🔗 Open</a>`:'—'}</td><td>${(+r.hours||0).toFixed(1)}</td><td><span class="status ${r.status.replace(' ','\\ ')}">${esc(r.status)}</span></td><td><button class="btn small" onclick="rmOpenNotesEditor('${r.id}')">📝 Notes</button> <button class="btn small" onclick="openRecord('${r.id}')">Edit</button> <button class="btn small danger" onclick="delRecord('${r.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No records found.</div>';
}

<script>

/* ===== COMPLETE MY RECORDS MANAGER ===== */
const RM_DB_PREFIX='my_work_hub_record_file_';
const RM_MAX_FILE=30*1024*1024;
let rmObjectUrls=[];
let rmEditId=null;
let rmSelectedFiles=[];

function rmType(name=''){
  const e=name.split('.').pop().toLowerCase();
  if(['jpg','jpeg','png','gif','webp','bmp','svg'].includes(e)) return 'image';
  if(e==='pdf') return 'pdf';
  if(['doc','docx','odt'].includes(e)) return 'doc';
  if(['xls','xlsx','csv'].includes(e)) return 'excel';
  if(['ppt','pptx'].includes(e)) return 'ppt';
  return 'other';
}
function rmIcon(type){return {image:'🖼️',pdf:'📕',doc:'📝',excel:'📊',ppt:'📽️',other:'📎'}[type]||'📎'}
function rmSize(n){if(!n)return '0 KB';const u=['B','KB','MB','GB'];let i=0,x=n;while(x>=1024&&i<u.length-1){x/=1024;i++}return `${x.toFixed(i?1:0)} ${u[i]}`}
function rmSafe(v){return esc(String(v??''))}
function rmNewId(){return 'file_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9)}
function rmFileKey(id){return RM_DB_PREFIX+id}
function rmOpenStore(){
  return idbOpen();
}
async function rmPutFile(id,file){
  const d=await rmOpenStore();
  return new Promise((resolve,reject)=>{
    const tx=d.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put({id,name:file.name,type:file.type||'application/octet-stream',size:file.size,blob:file},rmFileKey(id));
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  });
}
async function rmGetFile(id){
  const d=await rmOpenStore();
  return new Promise((resolve,reject)=>{
    const tx=d.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).get(rmFileKey(id));
    req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);
  });
}
async function rmDeleteFile(id){
  try{
    const d=await rmOpenStore();
    await new Promise((resolve,reject)=>{
      const tx=d.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(rmFileKey(id));
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
  }catch(e){}
}
function rmClearUrls(){
  rmObjectUrls.forEach(u=>URL.revokeObjectURL(u));
  rmObjectUrls=[];
}
function rmUrl(blob){
  const u=URL.createObjectURL(blob);rmObjectUrls.push(u);return u;
}
function rmRenderSelected(){
  const box=document.getElementById('rmFileList');if(!box)return;
  const existing=(document.getElementById('rmExistingFiles')?.value||'');
  if(!rmSelectedFiles.length&&!existing)return box.innerHTML='<div class="muted">No files selected.</div>';
  box.innerHTML=rmSelectedFiles.map((f,i)=>`
    <div class="rm-file">
      <div class="rm-file-icon">${rmIcon(rmType(f.name))}</div>
      <div class="rm-file-info"><div class="rm-file-name">${rmSafe(f.name)}</div><div class="rm-file-meta">${rmSize(f.size)} • New file</div></div>
      <button type="button" class="btn small" onclick="rmRemoveSelected(${i})">Remove</button>
    </div>`).join('');
}
function rmRemoveSelected(i){rmSelectedFiles.splice(i,1);rmRenderSelected()}
async function rmPickFiles(list){
  for(const f of Array.from(list||[])){
    if(f.size>RM_MAX_FILE){alert(`${f.name} is larger than 30 MB.`);continue}
    if(!rmSelectedFiles.some(x=>x.name===f.name&&x.size===f.size))rmSelectedFiles.push(f);
  }
  rmRenderSelected();
}
function rmDropSetup(){
  const input=document.getElementById('rmFiles'),drop=document.getElementById('rmDrop');
  if(input)input.onchange=e=>rmPickFiles(e.target.files);
  if(!drop)return;
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')}));
  drop.addEventListener('drop',e=>rmPickFiles(e.dataTransfer.files));
}

openRecord=async function(id,preCourse){
  rmClearUrls();rmEditId=id||null;rmSelectedFiles=[];
  const x=id?db.records.find(r=>r.id===id):null;

Meeting points
Important decisions
Work progress
Follow-up actions
References / observations
Other details">${rmSafe(plainText(x?.notes||''))}</textarea><div class="rm-notes-help">Write everything related to this record here. Photos and documents can be attached below.</div></div>

function rmRemoveExisting(fid){
  const x=rmEditId?db.records.find(r=>r.id===rmEditId):null;if(!x)return;
  x.attachments=(x.attachments||[]).filter(f=>f.id!==fid);
  rmDeleteFile(fid);
  const b=document.getElementById('rmFileList');
  if(b)b.querySelectorAll('.rm-file').forEach(el=>{if(el.innerHTML.includes(fid))el.remove()});
  if(b&&!b.children.length)b.innerHTML='<div class="muted">No files selected.</div>';
}

async function rmSaveRecord(){
  const fileInput=document.getElementById('rmFiles');
  const selected=rmSelectedFiles.slice();
  const old=rmEditId?db.records.find(r=>r.id===rmEditId):null;
  const title=f('fTitle').trim();
  if(!title){alert('Record Title is required.');return}
  const r=old||{id:uid('rec'),createdAt:new Date().toISOString()};
  Object.assign(r,{
    date:f('fDate'),categoryId:f('fCat'),typeId:f('fType'),courseId:f('fCourse'),topicId:f('fTopic'),
    title,notes:f('fNotes'),webLink:f('fWebLink').trim(),hours:+f('fHours')||0,status:f('fStatus'),
    priority:f('fPriority'),updatedAt:new Date().toISOString()
  });
  if(!Array.isArray(r.attachments))r.attachments=[];
  const btns=document.querySelectorAll('.modal-actions button');btns.forEach(b=>b.disabled=true);
  try{
    for(const file of selected){
      const fid=rmNewId();
      await rmPutFile(fid,file);
      r.attachments.push({id:fid,name:file.name,type:file.type||'application/octet-stream',size:file.size});
    }
    if(!old)db.records.push(r);
    save();closeModal();rmClearUrls();rmEditId=null;rmSelectedFiles=[];render();
  }catch(e){
    alert('Could not save one of the files. Please try again.');
    btns.forEach(b=>b.disabled=false);
  }
}

async function rmLoadFile(fid){
  try{return await rmGetFile(fid)}catch(e){return null}
}
async function rmViewRecord(id){
  rmClearUrls();const r=db.records.find(x=>x.id===id);if(!r)return;
  const files=Array.isArray(r.attachments)?r.attachments:[];
  openModal(`<div class="rm-view">
    <div class="section-head"><div><h2>👁️ ${rmSafe(r.title||'My Record')}</h2><div class="muted">${fmtDate(r.date)} • ${rmSafe(getCat(r.categoryId)?.name||'')}${r.location?' • '+rmSafe(r.location):''}</div></div><button class="btn" onclick="closeModal();rmClearUrls()">Close</button></div>
    <div class="notice"><b>⭐ Priority:</b> ${rmSafe(r.priority||'Normal')} &nbsp; <b>✅ Status:</b> ${rmSafe(r.status||'Started')}${r.tags?' &nbsp; <b>🏷️ Tags:</b> '+rmSafe(r.tags):''}</div>
    ${r.notes?`<div><h3>📝 Notes</h3><div class="rm-notes">${rmSafe(plainText(r.notes))}</div></div>`:'<div class="rm-empty">No notes added.</div>'}
    <div><h3>📎 Files (${files.length})</h3><div id="rmViewFiles" class="rm-file-list"><div class="muted">Loading files…</div></div></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal();rmClearUrls()">Close</button><button class="btn primary" onclick="closeModal();rmClearUrls();openRecord('${r.id}')">✏️ Edit Record</button></div>
  </div>`);
  const box=document.getElementById('rmViewFiles');
  if(!files.length){box.innerHTML='<div class="rm-empty">No files attached to this record.</div>';return}
  const loaded=await Promise.all(files.map(async f=>({meta:f,data:await rmLoadFile(f.id)})));
  box.innerHTML=loaded.map(({meta,data})=>{
    const t=rmType(meta.name);
    if(!data)return `<div class="rm-file"><div class="rm-file-icon">⚠️</div><div class="rm-file-info"><div class="rm-file-name">${rmSafe(meta.name)}</div><div class="rm-file-meta">File data not found in this browser.</div></div></div>`;
    const u=rmUrl(data.blob);
    return `<div class="rm-attachment-card">
      <div class="rm-file"><div class="rm-file-icon">${rmIcon(t)}</div><div class="rm-file-info"><div class="rm-file-name">${rmSafe(meta.name)}</div><div class="rm-file-meta">${rmSize(meta.size)}</div></div></div>
      ${t==='image'?`<img class="rm-photo" src="${u}" alt="${rmSafe(meta.name)}" onclick="rmPreviewImage('${u}','${rmSafe(meta.name)}')">`:''}
      ${t==='pdf'?`<iframe class="rm-pdf" src="${u}" title="${rmSafe(meta.name)}"></iframe>`:''}
      <div class="rm-attachment-actions"><a class="btn small primary" href="${u}" download="${rmSafe(meta.name)}">⬇️ Download</a>${t==='pdf'?`<button class="btn small" onclick="window.open('${u}','_blank','noopener')">Open PDF</button>`:''}</div>
    </div>`;
  }).join('');
}
function rmPreviewImage(url,name){
  openModal(`<div class="rm-view"><div class="section-head"><h2>${rmSafe(name)}</h2><button class="btn" onclick="rmViewRecord('${rmEditId||''}')">Close</button></div><img src="${url}" alt="${rmSafe(name)}" style="max-width:100%;max-height:75vh;object-fit:contain;border-radius:10px"></div>`);
}

renderRecords=function(c){
  const q=(document.getElementById('globalSearch')?.value||'').toLowerCase();
  c.innerHTML=`<div class="rm-toolbar">
    <input id="recordSearch" class="search" placeholder="🔍 Search records, notes, tags, files..." value="${rmSafe(q)}" aria-label="Search My Records">
    <select id="recordCategoryFilter" onchange="filterRecords()"><option value="">All Categories</option>${db.categories.map(x=>`<option value="${rmSafe(x.id)}">${rmSafe(x.icon||'📁')} ${rmSafe(x.name)}</option>`).join('')}</select>
    <select id="recordStatusFilter" onchange="filterRecords()"><option value="">All Status</option>${['Started','In Progress','Completed','Pending'].map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
    <button class="btn" onclick="clearRecordFilters()">Clear</button>
    <button class="btn primary" onclick="openRecord()">＋ Add My Record</button>
  </div><div id="recordTable"></div>`;
  document.getElementById('recordSearch').oninput=filterRecords;
  filterRecords();
};

filterRecords=function(){
  const wrap=document.getElementById('recordTable');if(!wrap)return;
  const q=(document.getElementById('recordSearch')?.value||'').toLowerCase();
  const cid=document.getElementById('recordCategoryFilter')?.value||'';
  const status=document.getElementById('recordStatusFilter')?.value||'';
  let rs=db.records.filter(r=>{
    const files=(r.attachments||[]).map(f=>f.name).join(' ');
    const text=[r.title,r.notes,r.webLink,r.date,r.priority,r.status,files,getCat(r.categoryId)?.name,getCourse(r.courseId)?.name,getTopic(r.topicId)?.name].join(' ').toLowerCase();
    return (!q||text.includes(q))&&(!cid||r.categoryId===cid)&&(!status||r.status===status);
  });
  rs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!rs.length){wrap.innerHTML='<div class="rm-empty">No records found. Click <b>＋ Add My Record</b> to create one.</div>';return}
  wrap.innerHTML=`<div class="muted" style="margin-bottom:8px">${rs.length} record${rs.length===1?'':'s'} found</div>
  <div class="cards">${rs.map(r=>{
    const fs=r.attachments||[];
    return `<div class="card record-card">
      <h3>${rmSafe(r.title||'Untitled Record')}</h3>
      <div class="muted">📅 ${fmtDate(r.date)}</div>
      <div class="muted" style="margin-top:5px">⭐ ${rmSafe(r.priority||'Normal')} • ✅ ${rmSafe(r.status||'Started')}</div>
      <div class="rm-attachments">${fs.length?fs.map(f=>`<span class="rm-chip">${rmIcon(rmType(f.name))} ${rmSafe(f.name)}</span>`).join(''):'<span class="muted">No attachments</span>'}</div>
      <div class="record-card-actions">
        <button class="btn small primary" onclick="rmViewRecord('${r.id}')">👁️ View</button>
        <button class="btn small" onclick="viewNotes('${r.id}')">📝 Notes</button>
        <button class="btn small danger record-delete-btn" onclick="delRecord('${r.id}')">🗑️ Delete</button>
      </div>
    </div>`;
  }).join('')}</div>`;
};
clearRecordFilters=function(){
  ['recordSearch','recordCategoryFilter','recordStatusFilter'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});
  filterRecords();
};

/* Keep existing delete behavior, but also remove attached files from IndexedDB. */
const rmOriginalDelRecord=delRecord;
delRecord=async function(id){
  const r=db.records.find(x=>x.id===id);if(!r)return;
  if(!confirm('Delete this My Record and all attached files?'))return;
  for(const f of (r.attachments||[]))await rmDeleteFile(f.id);
  db.records=db.records.filter(x=>x.id!==id);save();render();
};

<script>
/* Course/Lesson -> matching My Record.
   Clicking a Course/Lesson record opens the SAME full record viewer
   used by the View button, so notes, date, status and attached files
   are all visible in one place. */
function rmFindRecordByCourse(courseId, topicId){
  const rs=(db.records||[]).filter(r=>{
    if(courseId && r.courseId===courseId && (!topicId || r.topicId===topicId)) return true;
    return false;
  });
  rs.sort((a,b)=>(b.updatedAt||b.date||'').localeCompare(a.updatedAt||a.date||''));
  return rs[0]||null;
}

async function rmOpenCourseLessonRecord(courseId, topicId){
  const r=rmFindRecordByCourse(courseId,topicId);
  if(r){
    await rmViewRecord(r.id);
    return;
  }
  /* If there is no saved record yet, open Add My Record with the
     Course/Lesson preselected instead of showing a blank unrelated form. */
  rmEditId=null;
  rmSelectedFiles=[];
  await openRecord();
  const c=document.getElementById('fCourse');
  const t=document.getElementById('fTopic');
  if(c && courseId){
    c.value=courseId;
    c.dispatchEvent(new Event('change'));
  }
  if(t && topicId){
    t.value=topicId;
  }
}

/* Re-render the My Records cards so Course/Lesson is visible and clickable.
   The card's normal View/Edit/Notes/Delete controls remain available. */
const rmOriginalFilterRecords = filterRecords;
filterRecords=function(){
  rmOriginalFilterRecords();
  const wrap=document.getElementById('recordTable');
  if(!wrap)return;
  wrap.querySelectorAll('.record-card').forEach(card=>{
    const editBtn=Array.from(card.querySelectorAll('button')).find(b=>
      (b.textContent||'').includes('Edit')
    );
    if(!editBtn)return;
    const onclick=editBtn.getAttribute('onclick')||'';
    const m=onclick.match(/openRecord\('([^']+)'\)/);
    if(!m)return;
    const r=(db.records||[]).find(x=>x.id===m[1]);
    if(!r)return;

    const title=card.querySelector('h3');
    if(!title)return;

    const course=getCourse(r.courseId);
    const topic=getTopic(r.topicId);
    if(!course && !topic)return;

    const link=document.createElement('a');
    link.className='rm-record-link';
    link.href='#';
    link.setAttribute('aria-label',
      'Open record for '+(course?.name||'Course')+
      (topic?.name?' — '+topic.name:'')
    );
    link.onclick=(e)=>{
      e.preventDefault();
      rmViewRecord(r.id);
    };

    const label=document.createElement('div');
    label.className='rm-course-label';
    label.innerHTML='📚 <b>'+rmSafe(course?.name||'Course')+'</b>'+
      (topic?.name?' &nbsp;›&nbsp; '+rmSafe(topic.name):'');
    link.appendChild(title.cloneNode(true));
    link.appendChild(label);
    title.replaceWith(link);
  });
}
</script>

        </div>
        <div id="inlineNotesDisplay-${r.id}">
          ${r.notes?`<div class="notes-preview">${notesSanitize(r.notes)}</div>`:`<div class="empty">No notes added. Click <b>Edit</b> to start.</div>`}
        </div>
      </section>
      <section class="card">
        <h3>📎 Photos & Documents (${files.length})</h3>
        <div id="lessonDetailFiles" class="lesson-file-grid">
          ${files.length?'Loading attachments…':'<div class="empty">No attachments</div>'}
        </div>
      </section>
      ${r.webLink?`<section class="card"><h3>🔗 Reference</h3><a href="${rmSafe(r.webLink)}" target="_blank" rel="noopener noreferrer">${rmSafe(r.webLink)}</a></section>`:''}
      <div class="single-record-delete-bar">
        <button class="btn small danger" type="button" onclick="delRecord('${r.id}')">🗑️ Delete Record</button>
      </div>
    </div>`;
  if(!files.length)return;
  const loaded=await Promise.all(files.map(async f=>({meta:f,data:await rmLoadFile(f.id)})));
  const box=document.getElementById('lessonDetailFiles');
  if(!box)return;
  const photos=loaded.filter(x=>x.data&&rmType(x.meta.name)==='image');
  const others=loaded.filter(x=>x.data&&rmType(x.meta.name)!=='image');
  let html='';
  if(photos.length){
    html+=`<div class="lesson-photo-grid">${photos.map(({meta,data})=>{
      const u=rmUrl(data.blob);
      return `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="${rmSafe(meta.name)}"></a>`;
    }).join('')}</div>`;
  }
  html+=others.map(({meta,data})=>{
    const u=rmUrl(data.blob), t=rmType(meta.name);
    return `<div class="lesson-file">
      <div class="rm-file-icon">${rmIcon(t)}</div>
      <div class="grow"><div class="lesson-file-name">${rmSafe(meta.name)}</div><div class="lesson-file-meta">${rmSize(meta.size)}</div></div>
      ${t==='pdf'?`<button class="btn small" onclick="window.open('${u}','_blank','noopener')">View PDF</button>`:''}
      <a class="btn small primary" href="${u}" download="${rmSafe(meta.name)}">⬇️ Download</a>
    </div>
    ${t==='pdf'?`<iframe class="lesson-pdf" src="${u}" title="${rmSafe(meta.name)}"></iframe>`:''}`;
  }).join('');
  box.innerHTML=html||'<div class="empty">Attachment data is not available in this browser.</div>';
}

/* Make the existing Course → Lesson click open the separate lesson record page. */
topicRecords=function(id){openLessonRecordList(id)};

/* Also make the record title in My Records open the same separate full-page record view. */
const _oldFilterForSeparateView=filterRecords;
filterRecords=function(){
  _oldFilterForSeparateView();
  const wrap=document.getElementById('recordTable');if(!wrap)return;
  wrap.querySelectorAll('.record-card').forEach(card=>{
    const title=card.querySelector('h3');
    if(!title)return;
    const editBtn=Array.from(card.querySelectorAll('button')).find(b=>(b.textContent||'').includes('Edit'));
    const m=(editBtn?.getAttribute('onclick')||'').match(/openRecord\('([^']+)'\)/);
    if(!m)return;
    const r=db.records.find(x=>x.id===m[1]);if(!r)return;
    title.style.cursor='pointer';
    title.title='Open separate record view';
    title.onclick=()=>openSingleRecordPage(r.id);
  });
};

/* Extend the main renderer with the two dedicated views. */
const _baseRender=render;
render=function(){
  const c=document.getElementById('content');
  if(currentView==='lessonRecordView')return renderLessonRecordView(c);
  if(currentView==='singleRecordView')return renderSingleRecordView(c);
  return _baseRender();
};
</script>


<script>
/* ===== COURSE ROOT MANAGEMENT ===== */
function crmCourseCount(courseId){
  return (db.topics||[]).filter(t=>t.courseId===courseId).length;
}
function crmRecordCount(courseId){
  return (db.records||[]).filter(r=>r.courseId===courseId).length;
}
function crmSafeName(v){return rmSafe(v||'Untitled')}

function crmOpenCourse(courseId){
  const c=getCourse(courseId);
  if(!c)return;
  /* Use the existing course screen, but keep navigation consistent. */
  if(typeof showCourse==='function'){showCourse(courseId);return;}
  currentView='course';
  window._courseId=courseId;
  render();
}

function crmEditCourse(courseId){
  /* Reuse existing course editor when available. */
  if(typeof editCourse==='function'){editCourse(courseId);return;}
  if(typeof openCourseForm==='function'){openCourseForm(courseId);return;}
  alert('Course editor is not available in this version.');
}

function crmDeleteCourse(courseId){
  const c=getCourse(courseId);
  if(!c)return;
  const lessons=(db.topics||[]).filter(t=>t.courseId===courseId);
  const records=(db.records||[]).filter(r=>r.courseId===courseId);
  const msg=`Delete "${c.name}"?\n\n${lessons.length} lesson(s) and ${records.length} record(s) are linked to this course.`;
  if(!confirm(msg))return;
  db.categories=db.categories||[];
  db.courses=(db.courses||[]).filter(x=>x.id!==courseId);
  db.topics=(db.topics||[]).filter(x=>x.courseId!==courseId);
  db.records=(db.records||[]).filter(x=>x.courseId!==courseId);
  save(); render();
}

function crmRenderRoot(c){
  const courses=db.courses||[];
  const q=(document.getElementById('crmSearch')?.value||'').toLowerCase();
  const filtered=courses.filter(x=>{
    const type=getType(x.typeId), cat=type?getCat(type.categoryId):null;
    return !q || [x.name,type?.name,cat?.name].join(' ').toLowerCase().includes(q);
  });

  const totalLessons=courses.reduce((n,x)=>n+crmCourseCount(x.id),0);
  const totalRecords=courses.reduce((n,x)=>n+crmRecordCount(x.id),0);

  c.innerHTML=`
  <div class="crm-shell">
    <div class="crm-head">
      <div>
        <h2 class="crm-title">📚 Course Root Management</h2>
        <div class="crm-sub">Manage Courses → Lessons → My Records from one place.</div>
      </div>
      <div class="crm-actions">
        <button class="btn" onclick="history.back()">← Back</button>
        <button class="btn primary" onclick="addCourse()">＋ Add Course</button>
      </div>
    </div>

    <div class="crm-path">🏠 Home <span>›</span> <strong>Course Root Management</strong></div>

    <div class="crm-statbar">
      <div class="crm-stat"><b>${courses.length}</b><span>Courses</span></div>
      <div class="crm-stat"><b>${totalLessons}</b><span>Lessons</span></div>
      <div class="crm-stat"><b>${totalRecords}</b><span>My Records</span></div>
    </div>

    <div class="crm-toolbar">
      <input id="crmSearch" class="search" placeholder="🔍 Search courses, course types, categories..." aria-label="Search courses">
      <button class="btn" onclick="document.getElementById('crmSearch').value='';crmRenderRoot(document.getElementById('content'))">Clear</button>
    </div>

    ${filtered.length?`<div class="crm-grid">${filtered.map(course=>{
      const type=getType(course.typeId), cat=type?getCat(type.categoryId):null;
      const lessons=crmCourseCount(course.id), records=crmRecordCount(course.id);
      return `<article class="card crm-card">
        <a href="#" class="crm-primary" onclick="event.preventDefault();crmOpenCourse('${course.id}')">
          <h3>📚 ${crmSafeName(course.name)}</h3>
          <div class="muted">${cat?rmSafe(cat.icon||'📁')+' '+rmSafe(cat.name):''}${type?' › '+rmSafe(type.name):''}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">
            <span class="crm-count">📌 ${lessons} lesson${lessons===1?'':'s'}</span>
            <span class="crm-count">📝 ${records} record${records===1?'':'s'}</span>
          </div>
        </a>
        <div class="crm-card-actions">
          <button class="btn small primary" onclick="crmOpenCourse('${course.id}')">Open</button>
          <button class="btn small" onclick="crmEditCourse('${course.id}')">✏️ Edit</button>
          <button class="btn small danger" onclick="crmDeleteCourse('${course.id}')">🗑️ Delete</button>
        </div>
      </article>`;
    }).join('')}</div>`:
    `<div class="crm-empty">No courses found.<br><button class="btn primary" style="margin-top:10px" onclick="addCourse()">＋ Add Course</button></div>`}
  </div>`;

  document.getElementById('crmSearch').oninput=()=>crmRenderRoot(document.getElementById('content'));
}

/* If the existing app has a course-root view, make it use the polished screen.
   Otherwise expose a global function that can be called by the existing button. */
function openCourseRootManagement(){
  currentView='courseRootManagement';
  render();
}

const _crmBaseRender=render;
render=function(){
  const c=document.getElementById('content');
  if(currentView==='courseRootManagement')return crmRenderRoot(c);
  return _crmBaseRender();
};

/* Common navigation aliases, so existing Course Management buttons can call it. */
window.openCourseRootManagement=openCourseRootManagement;
window.courseRootManagement=openCourseRootManagement;
</script>

</body>
</html>
